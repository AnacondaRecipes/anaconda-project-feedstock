{% set version = "0.13.2" %}

package:
  name: anaconda-project
  version: {{ version }}

source:
  url: https://github.com/Anaconda-Platform/anaconda-project/archive/v{{ version }}.tar.gz
  sha256: c5244dc4a0eeb8e52214dd31c4b19a3ac89fa9c7fa3e999cfddaba68faabdfd9

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - anaconda-project = anaconda_project.cli:main

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - anaconda-client
    - conda-pack
    - entrypoints
    - jinja2
    - python
    - requests
    - ruamel.yaml >=0.15
    - tornado >=4.2
    - tqdm
    - tomli  # [py<311]

test:
  requires:
    - pip
    # adding conda to satisfy pip check
    # anaconda-anon-usage 0.7.5 requires conda, which is not installed.
    - conda
  imports:
    - anaconda_project
  commands:
    - pip check
    - echo "First of test commands"
    - anaconda-project --help
    - anaconda-project --version
    - echo "Last of test commands"

about:
  home: https://github.com/anaconda/anaconda-project
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Tool for encapsulating, running, and reproducing data science projects
  description: |
    By adding an anaconda-project.yml to a project directory, a single
    anaconda-project runcommand will be able to set up all dependencies
    and then launch the project.
  doc_url: https://anaconda-project.readthedocs.io
  dev_url: https://github.com/anaconda/anaconda-project

extra:
  recipe-maintainers:
    - fpliger
    - goanpeca
    - mingwandroid
    - bollwyvl
